# Verbo dashboard behind Caddy, which obtains and renews the HTTPS certificate.
services:
  dashboard:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      TRUST_PROXY: "1"
    volumes:
      - verbo-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard

volumes:
  verbo-data:
  caddy-data:
  caddy-config:
