# Verbo dashboard behind Caddy, which obtains and renews the HTTPS certificate.
services:
  dashboard:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      TRUST_PROXY: "1"
      # Optional, for one-tap Google Meet links (see README).
      PUBLIC_URL: https://${DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Verbo Pro (see "Verbo Pro" in README). Without the Razorpay keys the buy buttons are hidden.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PRO_LIFETIME_PAISE: ${PRO_LIFETIME_PAISE:-49900}
      PRO_MONTH_PAISE: ${PRO_MONTH_PAISE:-9900}
      DEVICE_LIMIT: ${DEVICE_LIMIT:-3}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - verbo-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard

volumes:
  verbo-data:
  caddy-data:
  caddy-config:
